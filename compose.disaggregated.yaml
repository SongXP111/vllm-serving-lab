services:
  vllm-prefill:
    image: vllm/vllm-openai:v0.25.1
    container_name: vllm-prefill
    restart: unless-stopped
    ports:
      - "8100:8000"
    environment:
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL:-RedHatAI/Qwen2.5-7B-Instruct-FP8-dynamic}
      --served-model-name ${VLLM_SERVED_MODEL:-qwen2.5-7b-instruct-fp8}
      --dtype ${VLLM_DTYPE:-auto}
      --max-model-len 4096
      --gpu-memory-utilization 0.42
      --max-num-batched-tokens 8192
      --enable-prefix-caching
      --generation-config vllm
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  vllm-decode:
    image: vllm/vllm-openai:v0.25.1
    container_name: vllm-decode
    restart: unless-stopped
    ports:
      - "8200:8000"
    environment:
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL:-RedHatAI/Qwen2.5-7B-Instruct-FP8-dynamic}
      --served-model-name ${VLLM_SERVED_MODEL:-qwen2.5-7b-instruct-fp8}
      --dtype ${VLLM_DTYPE:-auto}
      --max-model-len 4096
      --gpu-memory-utilization 0.42
      --max-num-batched-tokens 512
      --enable-prefix-caching
      --generation-config vllm
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
