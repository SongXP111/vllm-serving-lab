# ==============================================================================
# vLLM Serving Lab - Prefill-Decode Disaggregation Architecture Exploration
#
# 📌 架构设计与说明:
# 1. 应用层工作负载隔离模式 (默认模式):
#    - vllm-prefill (8100 端口): 专攻大 Batched Tokens 算力密集吞吐 (--max-num-batched-tokens 8192)
#    - vllm-decode  (8200 端口): 专攻短 Batch 低延迟流式吐字 (--max-num-batched-tokens 512)
#    - clients/disagg_router.py 作为网关按 Prompt 长度分流，消除单实例资源抢占抖动。
#
# 2. 算子级真·PD 分离模式 (vLLM Native KV Transfer via KV Connector):
#    - 若在多卡/集群环境中启用原生 KV 跨节点搬运，需在 command 中注入 --kv-transfer-config:
#      * vllm-prefill: --kv-transfer-config '{"kv_connector":"PyNcclConnector","kv_role":"kv_producer","kv_rank":0,"kv_parallel_size":2}'
#      * vllm-decode:  --kv-transfer-config '{"kv_connector":"PyNcclConnector","kv_role":"kv_consumer","kv_rank":1,"kv_parallel_size":2}'
# ==============================================================================

services:
  vllm-prefill:
    image: vllm/vllm-openai:v0.25.1
    container_name: vllm-prefill
    restart: unless-stopped
    ports:
      - "8100:8000"
    environment:
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL:-RedHatAI/Qwen2.5-7B-Instruct-FP8-dynamic}
      --served-model-name ${VLLM_SERVED_MODEL:-qwen2.5-7b-instruct-fp8}
      --dtype ${VLLM_DTYPE:-auto}
      --max-model-len 4096
      --gpu-memory-utilization 0.42
      --max-num-batched-tokens 8192
      --enable-prefix-caching
      --generation-config vllm
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  vllm-decode:
    image: vllm/vllm-openai:v0.25.1
    container_name: vllm-decode
    restart: unless-stopped
    ports:
      - "8200:8000"
    environment:
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL:-RedHatAI/Qwen2.5-7B-Instruct-FP8-dynamic}
      --served-model-name ${VLLM_SERVED_MODEL:-qwen2.5-7b-instruct-fp8}
      --dtype ${VLLM_DTYPE:-auto}
      --max-model-len 4096
      --gpu-memory-utilization 0.42
      --max-num-batched-tokens 512
      --enable-prefix-caching
      --generation-config vllm
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
