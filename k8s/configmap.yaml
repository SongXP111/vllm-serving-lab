apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: llm-serving
data:
  GATEWAY_ROUTING_POLICY: "cache+load-aware"
  GATEWAY_MAX_INFLIGHT: "12"
  GATEWAY_PER_REPLICA_MAX_INFLIGHT: "4"
  GATEWAY_QUEUE_CAPACITY: "30"
  GATEWAY_QUEUE_TIMEOUT: "15.0"
  GATEWAY_CONNECT_TIMEOUT: "2.0"
  GATEWAY_READ_TIMEOUT: "20.0"
  GATEWAY_WRITE_TIMEOUT: "5.0"
  GATEWAY_POOL_TIMEOUT: "3.0"
  GATEWAY_K8S_HEADLESS_SERVICE: "mock-vllm-headless.llm-serving.svc.cluster.local"
  GATEWAY_K8S_BACKEND_PORT: "8000"
  GATEWAY_K8S_DISCOVERY_INTERVAL: "1.0"
  GATEWAY_CB_FAILURE_THRESHOLD: "2"
  GATEWAY_CB_COOLDOWN_SECONDS: "10.0"
