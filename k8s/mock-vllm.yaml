apiVersion: v1
kind: Service
metadata:
  name: mock-vllm-headless
  namespace: llm-serving
  labels:
    app: mock-vllm
spec:
  # Headless Service (`clusterIP: None`) returns all Ready Pod IPs directly via DNS
  # so Gateway's ReplicaRegistry retains per-Pod visibility for Prefix-Aware Routing!
  clusterIP: None
  selector:
    app: mock-vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-vllm
  namespace: llm-serving
  labels:
    app: mock-vllm
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mock-vllm
  template:
    metadata:
      labels:
        app: mock-vllm
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: mock-vllm
          image: vllm-serving-lab/mock-vllm:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP_VERSION
              value: "v1"
            - name: SERVED_MODEL
              value: "mock-qwen2.5-7b-fp8"
            - name: STARTUP_DELAY_SEC
              value: "3.0"
            - name: TOKEN_DELAY_MS
              value: "35.0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # 1. Startup Probe: shields slow model weight loading from Liveness kills
          startupProbe:
            httpGet:
              path: /startupz
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          # 2. Readiness Probe: removes unready/draining Pod from Endpoints (NEVER restarts!)
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          # 3. Liveness Probe: lightweight process alive check (NEVER tied to load/queue!)
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Two-phase Graceful Drain:
          # 1) Mark /readyz -> 503 immediately while still honoring stray requests during
          #    the 4s Endpoints -> CoreDNS -> Gateway DNS propagation window.
          # 2) After 4s, reject any late new requests with 503 right before SIGTERM tells
          #    Uvicorn to drain remaining SSE streams cleanly and exit 0.
          lifecycle:
            preStop:
              exec:
                command:
                  - python
                  - -c
                  - "import urllib.request, time; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/admin/drain?reject_new=false', method='POST')); time.sleep(4); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/admin/drain?reject_new=true', method='POST'))"
