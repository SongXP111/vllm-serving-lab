services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    ipc: host
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # Fix for WSL2 memory pinning issue
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./results:/results
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3-8B-AWQ}
      --served-model-name ${VLLM_SERVED_MODEL:-qwen3-8b-awq}
      --dtype ${VLLM_DTYPE:-auto}
      --max-model-len 4096
      --gpu-memory-utilization 0.85
      --max-num-seqs 8
      ${PREFIX_CACHING_FLAG:---enable-prefix-caching}
      --max-num-batched-tokens ${MAX_BATCHED_TOKENS:-4096}
      --generation-config vllm
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40        # vLLM model loading can take several minutes
      start_period: 120s  # give the model time to load before marking unhealthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      vllm:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
